[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimble-agent-framework"
version = "0.1.0"
description = "Nimble Web Search Agent (Agent API V2) as a native Microsoft Agent Framework BaseAgent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wildcard" }]
keywords = ["agent-framework", "nimble", "web-search", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "agent-framework-core>=1.13.0,<2.0.0",
  "nimble-python>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Nimbleway/nimble-agent-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/nimble_agent_framework"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
